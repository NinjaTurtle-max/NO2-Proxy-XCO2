[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "no2xco2"
version = "0.1.0"
description = "NO2-proxy XCO2 reconstruction: physics-injected latent-grid graph model over East Asia"
requires-python = ">=3.10"
# 결과를 만든 판 (Python 3.10.20)
dependencies = [
    "numpy==1.24.3",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "torch==2.11.0",
    "xarray==2025.6.1",
    "netCDF4==1.7.4",
    "h5py==3.16.0",
    "scipy==1.13.1",
    "lightgbm==4.7.0",
    "matplotlib==3.10.8",
    "cartopy==0.25.0",
    "cdsapi==0.7.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B905", "B007", "B023"]
exclude = ["data", "runs", "docs"]

[tool.pytest.ini_options]
addopts = "-q"
markers = ["slow: 30 s 이상 걸리는 검사"]
